<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<body>
    <img src="public/narawit_logo.png" alt="Wittensky" width="150">

    <h1>Welcome to My Website</h1>
    <h2>Home</h2>
    
    <h2>About Me</h2>
    <p>My name is Narawit Siripol, and I am a Computer Science student with a passion for software development and data analysis.</p>

    <h3>My Selected Repositories</h3>
    <ul id="repo-list">
        <li>Loading selected repositories...</li>
    </ul>
    
    <h2>Contact Me</h2>
    <p>You can reach me via email at <a href="mailto:narawit.si@wittensky.com">narawit.si@wittensky.com</a></p>

    <script>
        const username = 'wittgenstein-byte';
        
        const selectedRepoNames = [
            'wittgenstein-byte',
            'End-to-End_News_Collector-Summarizer',
            'US-Traffic-Accident-BigData-Analysis',
            'BiHua',
            'kcal-kount'
        ];

        const repoList = document.getElementById('repo-list');

        async function fetchSelectedRepos() {
            try {
                // สร้างคำขอดึงข้อมูลเฉพาะแต่ละ Repo พร้อมกันผ่าน Promise.all
                const repoPromises = selectedRepoNames.map(name =>
                    fetch(`https://api.github.com/repos/${username}/${name}`)
                        .then(res => res.ok ? res.json() : null)
                );

                const repos = await Promise.all(repoPromises);
                repoList.innerHTML = '';

                repos.forEach(repo => {
                    if (repo) {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <a href="${repo.html_url}" target="_blank"><strong>${repo.name}</strong></a>
                            ${repo.description ? ` - ${repo.description}` : ''}
                            ${repo.language ? ` <em>(${repo.language})</em>` : ''}
                        `;
                        repoList.appendChild(li);
                    }
                });

                if (repoList.children.length === 0) {
                    repoList.innerHTML = '<li>No repositories found.</li>';
                }
            } catch (error) {
                console.error('Error loading repos:', error);
                repoList.innerHTML = '<li>Unable to load repositories.</li>';
            }
        }

        fetchSelectedRepos();
    </script>
</body>
</html>
